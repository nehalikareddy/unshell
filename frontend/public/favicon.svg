<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="uGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="1.5"/>

  <!-- Forensic Radar Ring / Outer Shell (Cracked Shell Arc) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 17 20 A 21 21 0 0 1 47 20" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="32 10" opacity="0.6"/>

  <!-- Interlocking Forensic 'U' / Broken Shell Monogram -->
  <path d="M 21 16 L 21 34 C 21 42 26 47 32 47 C 38 47 43 42 43 34 L 43 16"
        fill="none"
        stroke="url(#uGrad)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Investigation Graph Nodes & Edges inside U -->
  <line x1="32" y1="23" x2="26" y2="32" stroke="#00f2fe" stroke-width="1.2" opacity="0.7"/>
  <line x1="32" y1="23" x2="38" y2="32" stroke="#00f2fe" stroke-width="1.2" opacity="0.7"/>
  <line x1="26" y1="32" x2="38" y2="32" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- Graph Nodes -->
  <circle cx="32" cy="23" r="3.2" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="26" cy="32" r="2.4" fill="#38bdf8"/>
  <circle cx="38" cy="32" r="2.4" fill="#f59e0b"/>

  <!-- Forensic Reticle Center Core -->
  <circle cx="32" cy="23" r="1.2" fill="#0a0f1d"/>
</svg>